<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Abacus Speed</title><meta name="theme-color" content="#e47629"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mental Abacus"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#1c2934;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:620px;margin:auto}h1{font-size:25px;margin:8px 0}p{color:#607080}.panel{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #17283c12}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:650}select,input{width:100%;font-size:17px;padding:12px;border:1px solid #ccd4dd;border-radius:10px;background:white;margin-top:6px}button{border:0;background:#ea762c;color:white;font-size:17px;font-weight:700;padding:14px 20px;border-radius:12px;cursor:pointer}button.secondary{background:#e9eef3;color:#263c50}button:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;gap:10px;font-size:14px}.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:#e47629}.timer.danger{color:#d32639}.numbers{font-size:clamp(32px,8vw,54px);font-weight:650;line-height:1.25;letter-spacing:1px;display:flex;flex-direction:column;align-items:flex-end;width:max-content;min-width:115px;margin:22px auto 12px;font-variant-numeric:tabular-nums}.numbers div{width:100%;text-align:right}.numbers div:last-child{border-bottom:3px solid #253646;padding-bottom:8px}.answer{max-width:280px;display:block;margin:10px auto;text-align:center;font-size:28px}.center{text-align:center}.status{font-size:18px;font-weight:700;min-height:28px}.small{font-size:13px;color:#687888}.results{line-height:1.9}#feedback{min-height:24px;color:#576c7b}@media(max-width:380px){.settings{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🧮 Mental Abacus Speed</h1><p>Semua angka langsung terlihat. Waktu dicatat tanpa ditampilkan saat mengerjakan.</p><section class="panel" id="setup"><div class="settings"><label>Jumlah baris angka<select id="rows"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>10</option><option>15</option><option>20</option></select></label><label>Besaran angka<select id="digits"><option value="1">Satuan (1–9)</option><option value="2">Puluhan (10–99)</option><option value="3">Ratusan (100–999)</option></select></label><label>Operasi<select id="operation"><option value="mixed">Campuran + / −</option><option value="plus">Tambah saja</option><option value="minus">Kurang saja</option></select></label><label>Batas waktu / soal<select id="limit"><option value="0">Tanpa batas</option><option value="5">5 detik</option><option value="10" selected>10 detik</option><option value="15">15 detik</option><option value="20">20 detik</option><option value="30">30 detik</option><option value="60">60 detik</option></select></label><label>Jika waktu habis<select id="timeout"><option value="stop">Berhenti latihan</option><option value="retry">Ulangi soal yang sama</option></select></label><label>Jumlah soal<select id="total"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option></select></label></div><p class="small">Timer disembunyikan saat mengerjakan. Batas waktu tetap berlaku jika dipilih. Pengurangan dibuat agar hasil sementara tidak negatif.</p><button id="start">Mulai Latihan ▶</button></section><section class="panel hidden" id="game"><div class="stats"><span id="progress">Soal 1/10</span><span>Benar: <b id="correct">0</b></span><span class="timer hidden" id="timer" aria-hidden="true">0,0 dtk</span></div><div id="numbers" class="numbers" aria-label="Angka soal"></div><form id="answerForm" class="center"><label for="answer">Hasil perhitungan</label><input id="answer" class="answer" type="number" inputmode="numeric" autocomplete="off" required placeholder="Jawaban"><button type="submit">Jawab →</button></form><p id="feedback" class="center" aria-live="polite"></p><div class="actions"><button class="secondary" id="stop" type="button">Akhiri latihan</button></div></section><section class="panel hidden" id="finish"><h2 id="finishTitle">Hasil Latihan</h2><div class="results" id="results"></div><div class="actions"><button id="again">Latihan Lagi</button><button class="secondary" id="config">Ubah Pengaturan</button></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let cfg,question,index,correct,times,errors,started,raf,active=false,locked=false,attempts=0,epoch=0;const show=id=>['setup','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function makeQuestion(){const min=cfg.digits===1?1:10**(cfg.digits-1),max=10**cfg.digits-1;let current=rand(min,max),list=[current];for(let i=1;i<cfg.rows;i++){let sign=cfg.operation==='plus'?1:cfg.operation==='minus'?-1:Math.random()<.5?-1:1;if(sign===-1&&current<min)sign=1;const value=sign===-1?rand(1,Math.min(max,current)):rand(min,max);current+=sign*value;list.push(sign*value)}return{list,result:current}}function displayQuestion(reuse=false){epoch++;if(!reuse)question=makeQuestion();locked=false;active=true;attempts++;$('progress').textContent=`Soal ${index+1}/${cfg.total}`;$('correct').textContent=correct;$('numbers').replaceChildren(...question.list.map((n,i)=>{const d=document.createElement('div');d.textContent=i===0?String(n):(n>=0?'+ ':'− ')+Math.abs(n);return d}));$('answer').value='';$('feedback').textContent='';$('timer').classList.remove('danger');show('game');started=performance.now();cancelAnimationFrame(raf);tick();$('answer').focus()}function tick(){if(!active)return;const elapsed=(performance.now()-started)/1000;$('timer').textContent=elapsed.toFixed(1).replace('.',',')+' dtk';if(cfg.limit&&elapsed>=cfg.limit){$('timer').classList.add('danger');active=false;locked=true;cancelAnimationFrame(raf);errors++;if(cfg.timeout==='retry'){$('feedback').textContent='⏱ Waktu habis. Mengulang soal yang sama…';(()=>{const token=epoch;setTimeout(()=>{if(locked&&epoch===token)displayQuestion(true)},1100)})()}else finish('Waktu habis! Latihan dihentikan.');return}raf=requestAnimationFrame(tick)}function finish(reason='Latihan selesai!'){epoch++;active=false;locked=true;cancelAnimationFrame(raf);show('finish');$('finishTitle').textContent=reason;const avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;$('results').innerHTML=`<b>${correct}</b> dari <b>${cfg.total}</b> soal benar<br>Soal selesai: ${index+(reason==='Latihan selesai!'?0:0)}<br>Jawaban salah / waktu habis: ${errors}<br>Rata-rata jawaban benar: <b>${avg.toFixed(2).replace('.',',')} detik</b><br>Percobaan soal: ${attempts}`}$('start').onclick=()=>{cfg={rows:+$('rows').value,digits:+$('digits').value,operation:$('operation').value,limit:+$('limit').value,timeout:$('timeout').value,total:+$('total').value};index=0;correct=0;times=[];errors=0;attempts=0;displayQuestion()};$('answerForm').onsubmit=e=>{e.preventDefault();if(!active||locked)return;const elapsed=(performance.now()-started)/1000;if(cfg.limit&&elapsed>=cfg.limit){tick();return}const value=Number($('answer').value);active=false;locked=true;cancelAnimationFrame(raf);if(value===question.result){correct++;times.push(elapsed);$('feedback').textContent='✓ Benar!';index++;if(index>=cfg.total){finish();return}(()=>{const token=epoch;setTimeout(()=>{if(locked&&epoch===token)displayQuestion()},450)})()}else{errors++;$('feedback').textContent='✗ Belum tepat. Coba soal berikutnya.';index++;if(index>=cfg.total){finish();return}(()=>{const token=epoch;setTimeout(()=>{if(locked&&epoch===token)displayQuestion()},850)})()}};$('stop').onclick=()=>finish('Latihan diakhiri');$('again').onclick=()=>{index=0;correct=0;times=[];errors=0;attempts=0;displayQuestion()};$('config').onclick=()=>{epoch++;active=false;cancelAnimationFrame(raf);show('setup')};})();</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
