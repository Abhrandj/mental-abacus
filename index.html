<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e47629"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mental Abacus"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Mental Abacus V5</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#203244;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:15px}.app{max-width:640px;margin:auto}h1{font-size:25px;margin:10px 0 3px}p,.muted{color:#627385}.panel{background:white;border-radius:18px;padding:19px;margin:14px 0;box-shadow:0 4px 20px #14233812}.settings{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:13px;font-weight:700}select,input{width:100%;padding:12px;border:1px solid #cdd7df;border-radius:11px;background:#fff;font-size:16px;margin-top:6px}button{background:#e87829;color:white;border:0;border-radius:12px;padding:14px 19px;font-size:16px;font-weight:750;cursor:pointer}button.secondary{background:#e8edf3;color:#233b50}.actions{display:flex;gap:9px;flex-wrap:wrap}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;gap:8px;font-size:14px;align-items:center}.numbers{display:flex;flex-direction:column;align-items:flex-end;width:max-content;min-width:115px;margin:24px auto 18px;font-size:clamp(34px,9vw,57px);font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums}.numbers div{width:100%;text-align:right}.numbers div:last-child{border-bottom:3px solid #23384a;padding-bottom:8px}.answer{display:block;max-width:280px;margin:10px auto;font-size:29px;text-align:center}.center{text-align:center}.small{font-size:13px;color:#647789}.timer{font-size:20px;font-weight:800;color:#d86c1e;font-variant-numeric:tabular-nums}.results{line-height:2}.results b{font-size:18px}#feedback{min-height:26px} @media(max-width:390px){.settings{grid-template-columns:1fr}}
</style></head><body><main class="app"><h1>🧮 Mental Abacus Speed</h1><p>Latihan harian & simulasi kompetisi. Fokus pada soal, bukan jam.</p><section id="setup" class="panel"><div class="settings"><label>Mode<select id="mode"><option value="competition">Kompetisi</option><option value="practice">Latihan harian</option></select></label><label>Jumlah soal<select id="total"><option>10</option><option>20</option><option>40</option><option selected>80</option><option>100</option></select></label><label>Angka per soal<select id="rows"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>10</option><option>15</option><option>20</option></select></label><label>Digit angka<select id="digits"><option value="1">Satuan (1–9)</option><option value="2">Puluhan (10–99)</option><option value="3">Ratusan (100–999)</option></select></label><label>Operasi<select id="operation"><option value="mixed">Campuran + / −</option><option value="plus">Tambah saja</option><option value="minus">Kurang saja</option></select></label><label id="durationWrap">Waktu total<select id="duration"><option value="60">1 menit</option><option value="120">2 menit</option><option value="180" selected>3 menit</option><option value="300">5 menit</option><option value="600">10 menit</option><option value="0">Tanpa batas</option></select></label><label id="perQuestionWrap">Batas waktu per soal<select id="perQuestion"><option value="0" selected>Tanpa batas</option><option value="5">5 detik</option><option value="10">10 detik</option><option value="15">15 detik</option><option value="30">30 detik</option></select></label><label>Jika jawaban salah<select id="mistake"><option value="continue" selected>Catat & lanjut</option><option value="stop">Stop langsung</option><option value="retry">Ulangi soal</option></select></label><label>Jika waktu per soal habis<select id="timeout"><option value="stop">Stop</option><option value="retry">Ulangi soal</option><option value="continue">Lanjut soal berikutnya</option></select></label><label>Tampilan timer<select id="timerMode"><option value="hidden" selected>Sembunyikan</option><option value="visible">Tampilkan</option></select></label></div><p class="small">Dalam mode kompetisi, waktu total berlaku untuk seluruh soal. Jika waktu total habis, sesi langsung selesai, termasuk saat sedang mengulang soal.</p><button id="start">Mulai ▶</button></section><section id="game" class="panel hidden"><div class="stats"><span id="progress">Soal 1/80</span><span>Benar: <b id="correct">0</b></span><span id="timer" class="timer hidden"></span></div><div id="numbers" class="numbers"></div><form id="answerForm" class="center"><label for="answer">Hasil perhitungan</label><input id="answer" class="answer" type="number" inputmode="numeric" autocomplete="off" required placeholder="Jawaban"><button type="submit">Jawab →</button></form><p id="feedback" class="center" aria-live="polite"></p><button class="secondary" id="stop" type="button">Akhiri sesi</button></section><section id="finish" class="panel hidden"><h2 id="finishTitle">Hasil</h2><div id="results" class="results"></div><div class="actions"><button id="again">Ulangi Sesi</button><button class="secondary" id="config">Ubah Pengaturan</button></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let cfg,q,idx=0,correct=0,wrong=0,attempts=0,times=[],sessionStart=0,questionStart=0,raf=0,active=false,locked=false,token=0;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function show(id){['setup','game','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function updateMode(){const c=$('mode').value==='competition';$('durationWrap').classList.toggle('hidden',!c);$('perQuestionWrap').classList.toggle('hidden',c);$('timeout').parentElement.classList.toggle('hidden',c)}$('mode').onchange=updateMode;updateMode();
function question(){const min=10**(cfg.digits-1),max=10**cfg.digits-1;let sum=rand(min,max),nums=[sum];for(let i=1;i<cfg.rows;i++){let sign=cfg.operation==='plus'?1:cfg.operation==='minus'?-1:Math.random()<.5?-1:1;if(sign<0&&sum<1)sign=1;let n=sign<0?rand(1,Math.min(max,sum)):rand(min,max);sum+=sign*n;nums.push(sign*n)}return{nums,result:sum}}
function elapsed(){return(performance.now()-sessionStart)/1000}
function finish(reason){active=false;locked=true;token++;cancelAnimationFrame(raf);show('finish');$('finishTitle').textContent=reason;const sec=elapsed(),avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;const rows=[['Mode',cfg.mode==='competition'?'Kompetisi':'Latihan'],['Benar',correct+' / '+cfg.total],['Salah',wrong],['Belum dikerjakan',Math.max(0,cfg.total-idx)],['Total waktu',sec.toFixed(1)+' detik'],['Rata-rata jawaban benar',avg.toFixed(2)+' detik'],['Jumlah percobaan',attempts],['Akurasi percobaan',attempts?Math.round(100*correct/attempts)+'%':'0%']];$('results').replaceChildren(...rows.map(([a,b])=>{let d=document.createElement('div');d.textContent=a+': ';let strong=document.createElement('b');strong.textContent=b;d.append(strong);return d}))}
function startQuestion(reuse=false){token++;if(!reuse)q=question();locked=false;active=true;$('progress').textContent='Soal '+(idx+1)+'/'+cfg.total;$('correct').textContent=correct;$('numbers').replaceChildren(...q.nums.map((n,i)=>{let d=document.createElement('div');d.textContent=i===0?String(n):(n>=0?'+ ':'− ')+Math.abs(n);return d}));$('answer').value='';$('feedback').textContent='';$('timer').classList.toggle('hidden',cfg.timerMode==='hidden');questionStart=performance.now();show('game');cancelAnimationFrame(raf);tick();$('answer').focus()}
function next(){idx++;if(idx>=cfg.total){finish('Sesi selesai!');return}startQuestion()}
function timeoutQuestion(){if(!active)return;active=false;locked=true;wrong++;if(cfg.timeout==='stop'){finish('Waktu per soal habis');return}if(cfg.timeout==='continue'){next();return}startQuestion(true)}
function tick(){if(!active)return;const now=performance.now(),total=(now-sessionStart)/1000,per=(now-questionStart)/1000;if(cfg.mode==='competition'&&cfg.duration>0&&total>=cfg.duration){finish('Waktu kompetisi habis!');return}if(cfg.mode==='practice'&&cfg.perQuestion>0&&per>=cfg.perQuestion){timeoutQuestion();return}if(cfg.timerMode==='visible')$('timer').textContent=cfg.mode==='competition'&&cfg.duration>0?Math.max(0,Math.ceil(cfg.duration-total))+' dtk':per.toFixed(1)+' dtk';raf=requestAnimationFrame(tick)}
function begin(){cfg={mode:$('mode').value,total:+$('total').value,rows:+$('rows').value,digits:+$('digits').value,operation:$('operation').value,duration:+$('duration').value,perQuestion:+$('perQuestion').value,mistake:$('mistake').value,timeout:$('timeout').value,timerMode:$('timerMode').value};idx=correct=wrong=attempts=0;times=[];sessionStart=performance.now();startQuestion()}
$('start').onclick=begin;$('again').onclick=begin;$('config').onclick=()=>{active=false;locked=true;token++;cancelAnimationFrame(raf);show('setup')};$('stop').onclick=()=>finish('Sesi diakhiri');
$('answerForm').onsubmit=e=>{e.preventDefault();if(!active||locked)return;const now=performance.now();if(cfg.mode==='competition'&&cfg.duration>0&&(now-sessionStart)/1000>=cfg.duration){finish('Waktu kompetisi habis!');return}if(cfg.mode==='practice'&&cfg.perQuestion>0&&(now-questionStart)/1000>=cfg.perQuestion){timeoutQuestion();return}attempts++;const value=Number($('answer').value);if(value===q.result){correct++;times.push((now-questionStart)/1000);next()}else{wrong++;if(cfg.mistake==='stop')finish('Berhenti karena jawaban salah');else if(cfg.mistake==='retry')startQuestion(true);else next()}};
})();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
